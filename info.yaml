# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "Ultra-Low-Power Event-Driven ECG Sensor SoC in GF180MCU"
  team: "B08-Biosignal Foundry"
  discord: "Varchaswin"
  description: "Ultra-Low-Power ECG Sensor SoC with Ananlog R-Peak Detetion"
  lvs_config: "lvs_config.json"

pins:
  - name: VSS
    io_type: ground
  - name: VDD
    io_type: power
  - name: electrode_p
    io_type: analog
    secondary_esd: true
  - name: electrode_n
    io_type: analog
    secondary_esd: true
  - name: CLK
    io_type: input_schmitt
  - name: START
    io_type: analog
    secondary_esd: true
  - name: VDET
    io_type: analog
    secondary_esd: true
  - name: VREF
    io_type: analog
    secondary_esd: true
  - name: VBIAS
    io_type: analog
    secondary_esd: true
  - name: INA_OUT
    io_type: analog
    secondary_esd: true
